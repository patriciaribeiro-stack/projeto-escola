services:
  - type: web
    name: projeto-escola
    runtime: node
    plan: starter
    buildCommand: cd web && npm install && npm run build && cd ../server && npm install
    startCommand: cd server && npm run bootstrap && npm start
    disk:
      name: dados
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
